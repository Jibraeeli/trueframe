name: Terraform init
description: Installs Terraform and connects the main stack to its remote state

inputs:
  account-id:
    description: AWS account that owns the state bucket
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: 1.16.3
        # The wrapper changes how output is captured and breaks -raw.
        terraform_wrapper: false

    - name: Connect to remote state
      shell: bash
      working-directory: infra
      env:
        STATE_BUCKET: trueframe-tfstate-${{ inputs.account-id }}
      run: terraform init -input=false -backend-config="bucket=${STATE_BUCKET}"
