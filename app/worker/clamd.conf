# The daemon only listens on a local socket, reachable from inside the container.
LocalSocket /tmp/clamd.sock
DatabaseDirectory /var/lib/clamav
Foreground yes

# Signatures never change while the container runs, so skip the reload checks
# and the second copy of the database that a reload would hold in memory.
SelfCheck 0
ConcurrentDatabaseReload no

# The defaults skip files over 25 MB and report them as clean. Uploads can be
# 200 MB, so the limits sit above that, and anything over them is flagged
# rather than quietly passed.
MaxFileSize 250M
MaxScanSize 500M
AlertExceedsMax yes
